app = "fluentai-backend"
primary_region = "iad"

[build]
  image = "python:3.11-slim"

[env]
  PORT = "8001"
  PROVIDER = "openai"
  MODEL = "gpt-4o-mini"
  CORS_ORIGINS = "http://localhost:3000,http://localhost:3002"

[[services]]
  internal_port = 8001
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"